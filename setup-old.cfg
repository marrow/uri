[python]
with-pypy = true
with-docs = true
with-sphinx-doctests = false
with-windows = false
with-future-python = false
with-macos = true
with-free-threaded-python = false

[tox]
minversion = 3.18
envlist =
    release-check
    lint
    py310
    py311
    py312
    py313
    py314
    pypy3
    docs
    coverage

[flake8]
doctests = 1

[check-manifest]
ignore =
    .editorconfig
    .meta.toml

[isort]
force_single_line = True
combine_as_imports = True
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
known_third_party = pkg_resources, pytz
known_first_party =
line_length = 119
lines_after_imports = 2

[coverage]
fail-under = 99

[testenv]
usedevelop = true
package = wheel
wheel_build_env = .pkg
deps =
    setuptools >= 78.1.1, < 81
    pytest
commands =
    pytest {posargs:}
extras =
    docs

[testenv:setuptools-latest]
basepython = python3
deps =
    git+https://github.com/pypa/setuptools.git\#egg=setuptools

[testenv:release-check]
description = ensure that the distribution is ready to release
basepython = python3
skip_install = true
deps =
    setuptools >= 78.1.1,< 81
    wheel
    twine
    build
    check-manifest
    check-python-versions >= 0.20.0
    wheel
commands_pre =
commands =
    check-manifest
    check-python-versions --only pyproject.toml,setup.py,tox.ini,.github/workflows/tests.yml
    python -m build --sdist --no-isolation
    twine check dist/*

[testenv:lint]
description = This env runs all linters configured in .pre-commit-config.yaml
basepython = python3
skip_install = true
deps =
    pre-commit
commands_pre =
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:docs]
basepython = python3
skip_install = false
commands_pre =
commands =
    sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html
    sphinx-build -b doctest -d docs/_build/doctrees docs docs/_build/doctest

[testenv:coverage]
basepython = python3
allowlist_externals =
    mkdir
deps =
    coverage[toml]
commands =
    mkdir -p {toxinidir}/parts/htmlcov
    coverage run -m pytest --test-path=test {posargs:-vc}
    coverage run -a -m sphinx -b doctest -d {envdir}/.cache/doctrees docs {envdir}/.cache/doctest
    coverage html
    coverage report
